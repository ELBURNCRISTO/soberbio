<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Menú</title>
</head>
<body>
  <div th:replace="~{layout :: layout(~{::content})}">
    <th:block th:fragment="content">
      <h2>Menú</h2>
      <div class="grid">
        <article class="card" th:each="p : ${productos}">
          <img th:src="${p.imgUrl}" alt="" style="width:100%;max-height:200px;object-fit:cover">
          <h3 th:text="${p.nombre}"></h3>
          <p th:text="${p.descripcion}"></p>
          <strong th:text="'$' + ${p.precio}"></strong><br>
          <a th:href="@{'/producto/' + ${p.id}}" class="btn">Ver detalles</a>
        </article>
      </div>
    </th:block>
  </div>
</body>
</html>
