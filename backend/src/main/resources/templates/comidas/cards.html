<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Comidas - Tarjetas</title></head>
<body>
<h1>Comidas (tarjetas)</h1>
<p><a href="/comidas">Ver tabla</a></p>
<div th:each="c : ${comidas}" style="border:1px solid #ccc;padding:10px;margin:10px;display:inline-block;width:200px">
  <img th:src="${c.imgUrl}" style="width:100%;height:120px;object-fit:cover">
  <h3 th:text="${c.nombre}"></h3>
  <p th:text="${c.descripcion}"></p>
  <strong th:text="${c.precio}"></strong><br>
  <a th:href="@{'/comidas/' + ${c.id}}">Detalle</a>
</div>
</body>
</html>
