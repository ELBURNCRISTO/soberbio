<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${comida!=null? comida.nombre : 'No encontrado'}">Detalle</title></head>
<body>
<p><a href="/comidas">← Volver</a></p>
<div th:if="${comida!=null}">
  <img th:src="${comida.imgUrl}" style="max-width:300px"><br>
  <h1 th:text="${comida.nombre}"></h1>
  <p th:text="${comida.descripcion}"></p>
  <h3 th:text="${comida.precio}"></h3>
</div>
<div th:if="${comida==null}">
  <h2>Comida no encontrada</h2>
</div>
</body>
</html>
